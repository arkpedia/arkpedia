version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Next, its lint preset, and ESLint must move together. Independent major
    # bumps create an uninstallable dependency graph, so handle that migration
    # as one reviewed framework upgrade instead of separate bot PRs.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
