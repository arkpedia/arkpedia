version: 2
# Automatic version-update PRs are disabled. Security settings are managed separately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scripts/content
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]
