name: Deploy isolated unified data reader
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-data-reader
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy only the new-bucket data reader and verify GitHub parity
        run: node scripts/deploy/data-assets-worker.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: '1ff51c10571eaa9934bc451e1bfdb361'
          # The legacy asset token is scoped to arkpedia-assets. Reuse the
          # existing production deploy credential for the isolated new service.
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PRODUCTION_API_TOKEN || secrets.ARKPEDIA_PILOT_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: unified-data-reader-${{ github.run_id }}
          path: .cache/data-assets-deployment.json
          include-hidden-files: true
          if-no-files-found: error
