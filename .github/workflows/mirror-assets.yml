name: Mirror public GitHub assets to R2
on:
  workflow_dispatch:
    inputs:
      image_revision:
        description: Optional full arkpedia-image-assets commit to mirror before Preview publication
        type: string
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: public-assets-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    # Small manual asset preparation should not queue behind NAS application builds.
    runs-on: ${{ inputs.image_revision != '' && 'ubuntu-latest' || vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: public-assets
    steps:
      - name: Require native publication when native delivery is active
        if: vars.ARKPEDIA_ASSETS_DELIVERY == 'native' && vars.ARKPEDIA_NATIVE_ASSETS_MIRROR != 'true' && vars.ARKPEDIA_UNIFIED_ASSETS != 'true'
        run: |
          echo 'Native delivery requires the native mirror to remain enabled.'
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Game records live in arkpedia-data; this repository keeps code only. The live release's
      # records, the ones www serves (scripts/content/pull-data.mjs).
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Resolve immutable live and bundled sources
        run: |
          mkdir -p .cache
          node scripts/content/asset-mirror-plan.mjs > .cache/asset-mirror-plan.json
      - name: Include requested immutable image revision
        if: inputs.image_revision != ''
        env:
          IMAGE_REVISION: ${{ inputs.image_revision }}
        run: node scripts/content/add-image-mirror-pin.mjs .cache/asset-mirror-plan.json
      - name: Verify and mirror public files
        if: vars.ARKPEDIA_UNIFIED_ASSETS != 'true'
        run: node scripts/content/mirror-github-assets.mjs --pins=.cache/asset-mirror-plan.json --cache="$RUNNER_TOOL_CACHE/arkpedia-public-git" --report=.cache/r2-mirror-receipts.json
        env:
          ARKPEDIA_R2_ACCOUNT_ID: '1ff51c10571eaa9934bc451e1bfdb361'
          ARKPEDIA_R2_ACCESS_KEY_ID: ${{ secrets.ARKPEDIA_R2_ACCESS_KEY_ID }}
          ARKPEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.ARKPEDIA_R2_SECRET_ACCESS_KEY }}
      # Disabled until storage inventory, canary and explicit infrastructure activation.
      # Retain the source mirror for rollback. Only the native public view is additive.
      - name: Update the native public view within its reviewed storage budget
        if: vars.ARKPEDIA_NATIVE_ASSETS_MIRROR == 'true' && vars.ARKPEDIA_UNIFIED_ASSETS != 'true'
        run: node scripts/content/native-assets.mjs --apply --max-new-bytes="$NATIVE_NEW_BYTES" --max-total-bytes="$NATIVE_TOTAL_BYTES" --report=.cache/native-assets-receipts.json
        env:
          ARKPEDIA_R2_ACCOUNT_ID: '1ff51c10571eaa9934bc451e1bfdb361'
          ARKPEDIA_R2_ACCESS_KEY_ID: ${{ secrets.ARKPEDIA_R2_ACCESS_KEY_ID }}
          ARKPEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.ARKPEDIA_R2_SECRET_ACCESS_KEY }}
          ARKPEDIA_NATIVE_R2_ACCESS_KEY_ID: ${{ secrets.ARKPEDIA_NATIVE_R2_ACCESS_KEY_ID }}
          ARKPEDIA_NATIVE_R2_SECRET_ACCESS_KEY: ${{ secrets.ARKPEDIA_NATIVE_R2_SECRET_ACCESS_KEY }}
          NATIVE_NEW_BYTES: ${{ vars.ARKPEDIA_NATIVE_ASSETS_MAX_NEW_BYTES }}
          NATIVE_TOTAL_BYTES: ${{ vars.ARKPEDIA_NATIVE_ASSETS_MAX_TOTAL_BYTES }}
      - name: Publish public media and deduplicated JSON directly into the unified bucket
        if: vars.ARKPEDIA_UNIFIED_ASSETS == 'true'
        run: node scripts/content/unified-assets.mjs --apply --pins=.cache/asset-mirror-plan.json --cache="$RUNNER_TOOL_CACHE/arkpedia-public-git" --max-new-bytes="$NATIVE_NEW_BYTES" --max-total-bytes="$NATIVE_TOTAL_BYTES" --report=.cache/r2-mirror-receipts.json
        env:
          ARKPEDIA_R2_ACCOUNT_ID: '1ff51c10571eaa9934bc451e1bfdb361'
          ARKPEDIA_NATIVE_R2_ACCESS_KEY_ID: ${{ secrets.ARKPEDIA_NATIVE_R2_ACCESS_KEY_ID }}
          ARKPEDIA_NATIVE_R2_SECRET_ACCESS_KEY: ${{ secrets.ARKPEDIA_NATIVE_R2_SECRET_ACCESS_KEY }}
          NATIVE_NEW_BYTES: ${{ vars.ARKPEDIA_NATIVE_ASSETS_MAX_NEW_BYTES }}
          NATIVE_TOTAL_BYTES: ${{ vars.ARKPEDIA_NATIVE_ASSETS_MAX_TOTAL_BYTES }}
      - uses: actions/upload-artifact@v7
        with:
          name: public-assets-mirror-${{ github.run_id }}
          path: .cache/r2-mirror-receipts.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: vars.ARKPEDIA_NATIVE_ASSETS_MIRROR == 'true' && vars.ARKPEDIA_UNIFIED_ASSETS != 'true'
        with:
          name: native-assets-mirror-${{ github.run_id }}
          path: .cache/native-assets-receipts.json
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.image_revision == '' && vars.ARKPEDIA_ASSETS_DELIVERY != 'native'
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The deploy checks the reader against the live release's image pin
      # (data/assets/revisions.json), which arkpedia-data keeps, not this repository.
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Deploy only the public-assets reader
        run: node scripts/deploy/public-assets-worker.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: '1ff51c10571eaa9934bc451e1bfdb361'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ASSETS_DEPLOY_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: public-assets-deployment-${{ github.run_id }}
          path: .cache/public-assets-deployment.json
          include-hidden-files: true
          if-no-files-found: error
