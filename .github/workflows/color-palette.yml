name: Color Palette

on:
  pull_request:
    branches: [main, games-foundation, recruitment-guesser]
  workflow_dispatch:

concurrency:
  group: color-palette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:color-palette
