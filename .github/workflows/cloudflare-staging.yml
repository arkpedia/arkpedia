name: Build Cloudflare staging
run-name: ${{ inputs.pr && format('Preview PR {0} {1} Check {2}', inputs.pr, inputs.source, inputs.check_run) || 'Build isolated Cloudflare staging' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Full checked source SHA; blank builds the selected workflow commit only
        type: string
      pr:
        description: Internal preview PR binding
        type: string
      check_run:
        description: Internal successful Check binding
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-main-staging-build
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate immutable build inputs
        id: request
        env:
          STAGING_SOURCE: ${{ inputs.source }}
          STAGING_PR: ${{ inputs.pr }}
          STAGING_CHECK: ${{ inputs.check_run }}
        run: node controller/scripts/deploy/preview-request.mjs build-inputs
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.source }}
          path: site
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify source uses the reviewed staging configuration
        working-directory: site
        run: cmp wrangler.staging.jsonc ../controller/wrangler.staging.jsonc
      - run: npm ci
        working-directory: site
      - name: Verify staging isolation and indexing role
        working-directory: site
        run: node --test scripts/tests/test-cloudflare-staging.mjs scripts/tests/test-main-staging-role.mjs
      - name: Build once on Linux and check Worker budget
        working-directory: site
        run: node scripts/deploy/cloudflare-staging.mjs build
      - name: Package staging artifact with trusted producer
        working-directory: site
        shell: bash
        env:
          STAGING_COMMIT: ${{ steps.request.outputs.source }}
          STAGING_RUN: ${{ github.run_id }}
          PREVIEW_PR: ${{ steps.request.outputs.pr }}
          PREVIEW_CHECK: ${{ steps.request.outputs.checkRun }}
          PREVIEW_CONTROLLER: ${{ steps.request.outputs.controllerCommit }}
        run: |
          set -euo pipefail
          python ../controller/scripts/tests/test-staging-artifact.py
          tar -czf "$RUNNER_TEMP/arkpedia-staging.tgz" .open-next wrangler.staging.jsonc public/build-info.json
          args=()
          if [ -n "$PREVIEW_PR" ]; then
            args=(--preview-pr "$PREVIEW_PR" --preview-check-run "$PREVIEW_CHECK" --preview-controller "$PREVIEW_CONTROLLER")
          fi
          python ../controller/scripts/deploy/staging-artifact.py receipt \
            --archive "$RUNNER_TEMP/arkpedia-staging.tgz" \
            --commit "$STAGING_COMMIT" --run "$STAGING_RUN" \
            --receipt "$RUNNER_TEMP/arkpedia-staging-receipt.json" "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: arkpedia-staging-${{ steps.request.outputs.source }}
          path: |
            ${{ runner.temp }}/arkpedia-staging.tgz
            ${{ runner.temp }}/arkpedia-staging-receipt.json
          retention-days: 1
      # Small envelope resolves the request without downloading the app archive.
      - uses: actions/upload-artifact@v7
        if: steps.request.outputs.pr != ''
        with:
          name: arkpedia-staging-request-${{ steps.request.outputs.source }}
          path: ${{ runner.temp }}/arkpedia-staging-receipt.json
          retention-days: 1

      # No provider credentials or remote deployment. Completion resumes the controller.

  # GITHUB_TOKEN-dispatched builds do not reliably emit workflow_run callbacks.
  # A separate API-only job dispatches the trusted receiver with this run's ID.
  # The build job retains read-only permissions and never receives a provider token.
  notify-preview:
    needs: build
    if: success() && github.ref == 'refs/heads/main' && inputs.pr != '' && vars.ARKPEDIA_PREVIEWS_ENABLED == 'true'
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Resume trusted preview publication with this completed build
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
          COMPLETED_BUILD: ${{ github.run_id }}
        run: gh workflow run cloudflare-preview.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=publish -f pr="$PREVIEW_PR" -f completed_build="$COMPLETED_BUILD"
