name: Build Cloudflare staging

on:
  workflow_dispatch:
  # Bootstrap this proof without merging a new workflow into production first.
  push:
    branches: [codex/system-simplification]
    paths:
      - .github/workflows/cloudflare-staging.yml
      - wrangler.staging.jsonc
      - open-next.staging.config.ts
      - scripts/deploy/cloudflare-staging.mjs
      - scripts/tests/test-cloudflare-staging.mjs

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify staging isolation
        run: node --test scripts/tests/test-cloudflare-staging.mjs
      - name: Build once on Linux
        run: node scripts/deploy/cloudflare-staging.mjs build
      - name: Check Worker output budget
        run: node scripts/audits/check-worker-bundle.mjs
      - name: Package staging artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/arkpedia-staging.tgz" .open-next wrangler.staging.jsonc public/build-info.json
      - uses: actions/upload-artifact@v7
        with:
          name: arkpedia-staging-${{ github.sha }}
          path: ${{ runner.temp }}/arkpedia-staging.tgz
          retention-days: 1

      # No Cloudflare token here and no remote deployment: the first proof is
      # deployed locally with Wrangler OAuth after reviewing the artifact.
