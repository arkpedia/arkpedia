name: Check Music Guesser

on:
  pull_request:
    branches: [main, games-foundation]
  workflow_dispatch:

concurrency:
  group: check-music-guesser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  music-guesser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Music matching, audio preparation, round rules, and catalogue coverage
        run: npm run test:music-guesser
