name: Editorial content
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      after_run:
        description: A main Prepare content run that asked for this look (it is not counted as busy)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: editorial-content
  cancel-in-progress: false
jobs:
  watch:
    if: >-
      github.repository == 'arkpedia/arkpedia' &&
      github.ref_name == 'main'
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      # The "Editorial edits unpublished" issue (scripts/content/editorial-watch.mjs).
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts/content
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The deterministic watcher regressions run in Check's npm test; this
      # ten-minute poll only needs to inspect current source and dispatch work.
      - name: Start preparations for changed shared source
        env:
          GH_TOKEN: ${{ github.token }}
          ARKPEDIA_EDITORIAL_BRANCH: ${{ vars.ARKPEDIA_EDITORIAL_BRANCH || 'editorial' }}
          ARKPEDIA_AFTER_RUN: ${{ inputs.after_run || '' }}
        run: node scripts/content/editorial-watch.mjs
