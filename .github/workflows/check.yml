# Parallel CI preserves exact-source approval and complete browser execution evidence.
name: Check
on:
  # Keep these exclusions aligned with config/docs-only-paths.json and the release fingerprint.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: null
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  seen:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      checked: ${{ steps.seen.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Look for a green pull request Check of this exact code
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/already-checked.mjs >> "$GITHUB_OUTPUT"
      - name: Mark main green again when its pull request's Check vouches
        if: steps.seen.outputs.checked == 'true' && github.ref == 'refs/heads/main'
        run: echo 'Exact-tree Check proof verified; the trusted main-report job handles issue reporting.'
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Application and Python regression tests
        run: |
          npm run test:py > "$RUNNER_TEMP/python-tests.log" 2>&1 &
          python_pid=$!
          regression_status=0
          npm test || regression_status=$?
          wait "$python_pid" || regression_status=$?
          cat "$RUNNER_TEMP/python-tests.log"
          exit "$regression_status"
      - name: Prepare build inputs
        run: npm run prebuild
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Lint
        run: npm run lint -- --max-warnings 15
      - name: Lint pipeline scripts
        run: npm run lint:scripts
      - name: Style and code graph checks
        run: npm run check:styles && npm run audit:styles && npm run audit:unused
      - name: Report draft coverage
        run: |
          echo 'Draft feedback passed: application/Python tests, generated inputs, types, lint, style and code graph. No website build, browser coverage or reusable Check proof. Mark ready for review to run the full release gate.' >> "$GITHUB_STEP_SUMMARY"
  production-build:
    needs: seen
    if: ${{ !cancelled() && needs.seen.outputs.checked != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Compile and check the production Worker
        run: npm run cf:build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
  # Quality gates overlap both site builds; check remains the required final verdict.
  validation:
    needs: seen
    if: ${{ !cancelled() && needs.seen.outputs.checked != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Application and Python regression tests
        run: |
          npm run test:py > "$RUNNER_TEMP/python-tests.log" 2>&1 &
          python_pid=$!
          regression_status=0
          npm test || regression_status=$?
          wait "$python_pid" || regression_status=$?
          cat "$RUNNER_TEMP/python-tests.log"
          exit "$regression_status"
      - name: External asset coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:assets && npm run check:published-assets
      - name: Page payload budgets
        run: npm run check:payload-budgets
      - name: Style drift ratchet
        run: npm run audit:styles
      - name: Unused code and dependencies
        run: npm run audit:unused
      - name: Every rendered class is styled
        run: npm run check:styles
      - name: Compile and validate runtime content
        run: npm run content:export -- --check && npm run content:validate
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Prepare build inputs
        run: npm run prebuild
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Lint
        run: npm run lint -- --max-warnings 15
      - name: Lint pipeline scripts
        run: npm run lint:scripts
  content-check:
    needs: seen
    if: ${{ !cancelled() && needs.seen.outputs.checked != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Pull the live game records for runtime fixtures
        run: node scripts/content/pull-data.mjs
      - name: Prepare runtime content fixture
        run: npm run content:export -- --check && npm run content:validate
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Pull the pinned game records for the browser specs
        run: node scripts/content/pull-data.mjs --pinned
      - name: Prepare pinned browser build inputs
        run: npm run prebuild
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Cache Next compiler inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next-live/cache
          key: ${{ runner.os }}-next-content-node22-${{ hashFiles('package-lock.json', 'tests/browser/data-pin.json', 'next.config.js') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-content-node22-${{ hashFiles('package-lock.json', 'tests/browser/data-pin.json', 'next.config.js') }}-
      - name: Pages render the live content release
        run: |
          npx next build --webpack
          grep -q '"__contentRelease"' .next-live/server/pages/stages/seasonal.json
        env:
          ARKPEDIA_BUILD_CHECKS_PASSED: '1'
          NEXT_DIST_DIR: .next-live
          NEXT_TELEMETRY_DISABLED: '1'
          ARKPEDIA_YOUTUBE_FEED_FIXTURE: tests/fixtures/youtube-feeds.xml
          NODE_ENV: production
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Content updates and rollback without rebuilding
        run: |
          df -h "$TMPDIR" /tmp /dev/shm
          npm run test:content-runtime
        env:
          NEXT_DIST_DIR: .next-live
          TMPDIR: ${{ runner.temp }}
  # Build once from pinned fixtures, then distribute this exact site within this run.
  browser-build:
    needs: seen
    if: ${{ !cancelled() && needs.seen.outputs.checked != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Pull the pinned game records for the browser specs
        run: node scripts/content/pull-data.mjs --pinned
      - name: Prepare pinned browser build inputs
        run: npm run prebuild
        env:
          NODE_ENV: production
          ARKPEDIA_CONTENT_DISABLED: '1'
      - name: Cache Next compiler inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-browser-node22-${{ hashFiles('package-lock.json', 'tests/browser/data-pin.json', 'next.config.js') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-browser-node22-${{ hashFiles('package-lock.json', 'tests/browser/data-pin.json', 'next.config.js') }}-
      - name: Build
        run: npm run --ignore-scripts build && npm run postbuild
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          ARKPEDIA_BUILD_CHECKS_PASSED: '1'
          ARKPEDIA_CONTENT_DISABLED: '1'
          ARKPEDIA_YOUTUBE_FEED_FIXTURE: tests/fixtures/youtube-feeds.xml
          NODE_ENV: production
      - name: Which browser regressions this change needs
        id: browser
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BROWSER_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BROWSER_EXPEDITED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release:expedite') && '1' || '' }}
        run: node scripts/ci/browser-lane.mjs plan >> "$GITHUB_OUTPUT"
      - name: Partition browser coverage
        id: shards
        run: node scripts/ci/browser-shards.mjs plan >> "$GITHUB_OUTPUT"
      - name: Package checked browser site
        run: node scripts/ci/browser-site.mjs pack
      - name: Share checked browser site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-site
          path: |-
            .cache/browser-site.tgz
            .cache/browser-site-manifest.json
          include-hidden-files: true
          retention-days: 2
          overwrite: true
    outputs:
      lane: ${{ steps.browser.outputs.lane }}
      matrix: ${{ steps.shards.outputs.matrix }}
      partition: ${{ steps.shards.outputs.partition }}
  browser-tests:
    needs: browser-build
    if: '!cancelled() && needs.browser-build.result == ''success'' && needs.browser-build.outputs.lane != ''none'''
    name: browser (${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-build.outputs.matrix || '{"include":[{"index":1,"total":1}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Download checked browser site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-site
          path: .cache
      - name: Restore checked browser site
        run: node scripts/ci/browser-site.mjs restore
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Prepare browser shard
        run: node scripts/ci/browser-shards.mjs prepare "${{ matrix.index }}" "${{ matrix.total }}"
      - name: Desktop and mobile browser regressions
        if: needs.browser-build.outputs.lane == 'full'
        run: npm run test:browser -- --test-list .cache/browser-shard-tests.txt --project desktop --project mobile --reporter=list,json,github
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/browser-shard-report.json
          TMPDIR: ${{ runner.temp }}
          PW_WORKERS: '2'
      - name: Selected browser regressions
        if: needs.browser-build.outputs.lane == 'targeted'
        run: npm run test:browser -- --test-list .cache/browser-shard-tests.txt --project desktop --project mobile --reporter=list,json,github
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/browser-shard-report.json
          TMPDIR: ${{ runner.temp }}
          PW_WORKERS: '2'
      - name: Record browser shard
        run: node scripts/ci/browser-shards.mjs record "${{ matrix.index }}" "${{ matrix.total }}"
      - name: Share browser shard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-result-${{ needs.browser-build.outputs.partition }}-${{ matrix.index }}
          path: .cache/browser-shard-result
          include-hidden-files: true
          retention-days: 2
          overwrite: true
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failure-${{ github.run_id }}-${{ matrix.index }}-${{ github.run_attempt }}
          path: |-
            test-results/
            .cache/browser-shard-report.json
            .cache/browser-plan.json
          include-hidden-files: true
          retention-days: 3
  # Missing or failed dependencies must reach the fail-closed gate below.
  check:
    needs:
      - seen
      - validation
      - production-build
      - content-check
      - browser-build
      - browser-tests
    if: ${{ !cancelled() && needs.seen.outputs.checked != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Require parallel checks
        run: |-
          test "$VALIDATION" = success
          test "$CONTENT" = success
          test "$WORKER" = success
          test "$BUILD" = success
          if [ "$LANE" = none ]; then test "$BROWSERS" = skipped; else test "$BROWSERS" = success; fi
        env:
          VALIDATION: ${{ needs.validation.result }}
          CONTENT: ${{ needs.content-check.result }}
          WORKER: ${{ needs.production-build.result }}
          BUILD: ${{ needs.browser-build.result }}
          BROWSERS: ${{ needs.browser-tests.result }}
          LANE: ${{ needs.browser-build.outputs.lane }}
      - name: Download checked browser site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-site
          path: .cache
      - name: Restore checked browser site
        run: node scripts/ci/browser-site.mjs restore
      - name: Download browser shard evidence
        if: needs.browser-build.outputs.lane == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: browser-result-${{ needs.browser-build.outputs.partition }}-*
          path: .cache/browser-shard-downloads
      # download-artifact flattens a single match into `path`, even for a pattern.
      # Preserve the merger's named-shard contract for the targeted lane too.
      - name: Download single browser shard evidence
        if: needs.browser-build.outputs.lane == 'targeted'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-result-${{ needs.browser-build.outputs.partition }}-1
          path: .cache/browser-shard-downloads/browser-result-${{ needs.browser-build.outputs.partition }}-1
      - name: Merge browser shard evidence
        if: needs.browser-build.outputs.lane != 'none'
        run: node scripts/ci/browser-shards.mjs merge
      - name: Full-census completion contract
        id: completion
        if: needs.browser-build.outputs.lane == 'full'
        run: npm run test:browser -- --test-list .cache/browser-completion-tests.txt --project after-census --no-deps --output test-results-completion --reporter=list,json,github && node scripts/ci/browser-shards.mjs complete
        env:
          ARKPEDIA_BROWSER_COMPLETION_ONLY: '1'
          ARKPEDIA_CENSUS_STACK_DIR: .cache/census-stack-align
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/browser-completion-report.json
          TMPDIR: ${{ runner.temp }}
      - name: Validate browser execution evidence
        id: validate_browser
        run: node scripts/ci/browser-lane.mjs complete
      - name: Validate full browser shard execution
        id: full_browser
        if: needs.browser-build.outputs.lane == 'full'
        run: node scripts/ci/browser-shards.mjs verify-full
      - name: Validate selected browser shard execution
        id: selected_browser
        if: needs.browser-build.outputs.lane == 'targeted'
        run: node scripts/ci/browser-shards.mjs verify-targeted
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-merge-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            .cache/browser-results.json
            .cache/browser-plan.json
            .cache/browser-completion-report.json
            test-results-completion/
          include-hidden-files: true
          retention-days: 3
      - name: Name the code this Check passed
        id: tree
        if: success() && github.event_name == 'pull_request'
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          node -e 'console.log("policy=" + require("./.cache/browser-evidence.json").policySha256)' >> "$GITHUB_OUTPUT"
      - name: Record the code this Check passed
        if: success() && github.event_name == 'pull_request' && needs.browser-build.outputs.lane == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checked-tree-${{ steps.tree.outputs.tree }}
          path: package.json
          retention-days: 7
      - name: Record selected browser coverage
        if: success() && github.event_name == 'pull_request' && (needs.browser-build.outputs.lane == 'targeted' || needs.browser-build.outputs.lane == 'none')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checked-policy-tree-${{ steps.tree.outputs.tree }}-${{ steps.tree.outputs.policy }}
          path: .cache/browser-evidence.json
          retention-days: 7
          include-hidden-files: true
  main-report:
    needs:
      - seen
      - check
      - production-build
      - validation
      - content-check
      - browser-build
      - browser-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Report a red Check on main
        if: needs.seen.result == 'failure' || needs.check.result == 'failure' || needs.production-build.result == 'failure' || needs.validation.result == 'failure' || needs.content-check.result == 'failure' || needs.browser-build.result == 'failure' || needs.browser-tests.result == 'failure' || needs.seen.result == 'cancelled' || needs.check.result == 'cancelled' || needs.production-build.result == 'cancelled' || needs.validation.result == 'cancelled' || needs.content-check.result == 'cancelled' || needs.browser-build.result == 'cancelled' || needs.browser-tests.result == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ (needs.seen.result == 'failure' || needs.check.result == 'failure' || needs.production-build.result == 'failure' || needs.validation.result == 'failure' || needs.content-check.result == 'failure' || needs.browser-build.result == 'failure' || needs.browser-tests.result == 'failure') && 'failure' || 'cancelled' }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = cancelled ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Superseded by a newer push to main, whose own run reports."
            exit 0
          fi
          body="$RUNNER_TEMP/red-check.md"
          echo "Check ended with $JOB_STATUS on main at ${GITHUB_SHA:0:12} ($(date -u '+%Y-%m-%d %H:%M UTC')): $RUN_URL. Nothing deploys until a Check on main passes, and content releases stay held while production runs older code." > "$body"
          node scripts/content/alert-issue.mjs open --alert check-failing-main --title 'Check failing on main' --body-file "$body"
      - name: Close the red-Check report
        if: needs.seen.result != 'failure' && (needs.seen.outputs.checked == 'true' || (needs.check.result == 'success' && needs.production-build.result == 'success'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/content/alert-issue.mjs close --alert check-failing-main --title 'Check failing on main' --comment "Green again at ${GITHUB_SHA:0:12}: $RUN_URL"
