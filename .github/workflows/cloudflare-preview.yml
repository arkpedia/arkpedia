name: Build and publish Cloudflare Preview
run-name: Native Preview ${{ inputs.source || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Full checked source SHA to publish to isolated Preview
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: arkpedia-native-preview
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Require successful exact-source Check
        env:
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/preview-source-gate.mjs

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Check Preview isolation and internal self-calls
        run: node --test scripts/tests/test-native-preview.mjs
      - name: Build Preview without deployment credentials
        env:
          ARKPEDIA_WORKER: '1'
          ARKPEDIA_CONTENT_CHANNEL: live
          ARKPEDIA_DEPLOYMENT_ROLE: staging
          NODE_OPTIONS: --max-old-space-size=4096
        run: node node_modules/@opennextjs/cloudflare/dist/cli/index.js build --config wrangler.preview.jsonc --openNextConfigPath open-next.preview.config.ts
      - name: Package immutable Preview
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          node scripts/deploy/check-public-assets-ready.mjs
          node -e 'const b=require("./public/build-info.json");if(b.commit!==process.env.SOURCE||b.dirty||b.deploymentRole!=="staging")throw Error("Unexpected Preview build")'
          tar --exclude=.open-next/cache -czf "$RUNNER_TEMP/arkpedia-preview.tgz" .open-next public/build-info.json migrations/accounts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: bundle
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arkpedia-preview.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [authorize, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # Publisher scripts, dependencies and binding configuration come only from
      # the main commit that dispatched this workflow, never the candidate source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Revalidate exact-source Check before publication
        env:
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy/preview-source-gate.mjs
          git cat-file -e "$SOURCE^{commit}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: preview-artifact
          merge-multiple: true
      - name: Verify build and extract
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          python3 scripts/deploy/extract-preview.py preview-artifact/arkpedia-preview.tgz .
          node --test scripts/tests/test-native-preview.mjs
          node scripts/deploy/check-build-identity.mjs preview-local
      - name: Verify recovery and apply isolated Preview account migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PREVIEW_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ff51c10571eaa9934bc451e1bfdb361
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/deploy/native-preview.mjs check
          node scripts/deploy/preview-account-recovery.mjs
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply arkpedia-preview-accounts --config "$RUNNER_TEMP/preview-accounts.json" --remote
      - name: Publish the native Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ff51c10571eaa9934bc451e1bfdb361
          WRANGLER_SEND_METRICS: 'false'
          OPEN_NEXT_DEPLOY: 'true'
          SOURCE: ${{ inputs.source }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node node_modules/wrangler/bin/wrangler.js preview --config wrangler.preview.jsonc --worker-name arkpedia --name arkpedia --message "Redesign Preview $SOURCE"
      - name: Verify the served Preview source
        env:
          SOURCE: ${{ inputs.source }}
        run: node scripts/deploy/check-build-identity.mjs preview
