name: Build and publish Cloudflare Preview
run-name: Native Preview ${{ inputs.source || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Full source SHA to publish to the isolated redesign Preview
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: arkpedia-native-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 25
    steps:
      - name: Validate immutable source
        env:
          SOURCE: ${{ inputs.source }}
        run: '[[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      # Game records live in arkpedia-data; this repository keeps code only. The live release's
      # records, the ones www serves (scripts/content/pull-data.mjs).
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Check Preview isolation and internal self-calls
        run: node --test scripts/tests/test-native-preview.mjs
      - name: Build Preview without deployment credentials
        env:
          ARKPEDIA_WORKER: '1'
          ARKPEDIA_CONTENT_CHANNEL: live
          ARKPEDIA_DEPLOYMENT_ROLE: staging
          # Match production: Node 24's default heap is too small for this typecheck.
          NODE_OPTIONS: --max-old-space-size=4096
        run: node node_modules/@opennextjs/cloudflare/dist/cli/index.js build --config wrangler.preview.jsonc --openNextConfigPath open-next.preview.config.ts
      - name: Package immutable Preview
        run: |
          node scripts/deploy/check-public-assets-ready.mjs
          node -e 'const b=require("./public/build-info.json");if(b.commit!==process.env.SOURCE||b.dirty||b.deploymentRole!=="staging")throw Error("Unexpected Preview build")'
          tar --exclude=.open-next/cache -czf "$RUNNER_TEMP/arkpedia-preview.tgz" .open-next wrangler.preview.jsonc scripts/deploy/preview-worker.mjs scripts/deploy/preview-security.mjs public/build-info.json
          cd "$RUNNER_TEMP"
          sha256sum arkpedia-preview.tgz > arkpedia-preview.sha256
        env:
          SOURCE: ${{ inputs.source }}
      # The bundle crosses to the publish job through the Actions cache, not artifact storage: the organisation's
      # artifact quota filled on 2026-11-11 and GitHub recounts it only every 6-12 hours, which stopped every
      # Preview publish meanwhile. The cache has its own allowance and evicts its oldest entries by itself.
      - name: Stage the bundle for the publish job
        run: |
          mkdir -p preview-artifact
          cp "$RUNNER_TEMP/arkpedia-preview.tgz" "$RUNNER_TEMP/arkpedia-preview.sha256" preview-artifact/
      - uses: actions/cache/save@v6
        with:
          path: preview-artifact
          key: arkpedia-preview-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/cache/restore@v6
        with:
          path: preview-artifact
          key: arkpedia-preview-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify build and extract
        run: |
          cd preview-artifact
          sha256sum -c arkpedia-preview.sha256
          cd ..
          tar -xzf preview-artifact/arkpedia-preview.tgz
          node --test scripts/tests/test-native-preview.mjs
          node -e 'const b=require("./public/build-info.json");if(b.commit!==process.env.SOURCE||b.dirty||b.deploymentRole!=="staging")throw Error("Unexpected Preview build")'
        env:
          SOURCE: ${{ inputs.source }}
      - name: Verify recovery and apply isolated Preview account migrations
        env:
          # Worker publication credentials deliberately have no database permissions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PREVIEW_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ff51c10571eaa9934bc451e1bfdb361
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/deploy/native-preview.mjs check
          node scripts/deploy/preview-account-recovery.mjs
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply arkpedia-preview-accounts --config "$RUNNER_TEMP/preview-accounts.json" --remote
      - name: Publish the native Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PRODUCTION_API_TOKEN || secrets.ARKPEDIA_PILOT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ff51c10571eaa9934bc451e1bfdb361
          WRANGLER_SEND_METRICS: 'false'
          OPEN_NEXT_DEPLOY: 'true'
        run: node node_modules/wrangler/bin/wrangler.js preview --config wrangler.preview.jsonc --worker-name arkpedia --name arkpedia --message "Redesign Preview ${{ inputs.source }}"
      - name: Verify the served Preview source
        run: node scripts/deploy/check-build-identity.mjs preview
