name: Cloudflare feature preview

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publish the exact checked build, or retire this PR's owned preview
        type: choice
        options: [publish, retire]
        default: publish
      pr:
        description: Same-repository pull request targeting main
        required: true
        type: string
      source:
        description: Full source SHA (publish only)
        type: string
      check_run:
        description: Successful Check run for that exact source (publish only)
        type: string
      build_run:
        description: Successful Build Cloudflare staging run (publish only)
        type: string
      artifact:
        description: Exact staging artifact ID from that build (publish only)
        type: string
  # Runs the trusted base workflow only; never checks out a PR head with secrets.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read
  pull-requests: read

# One existing staging slot. Every publish/update/retirement uses this lock.
# A newer request must not cancel a provider mutation or its failure recovery.
concurrency:
  group: arkpedia-staging-slot
  cancel-in-progress: false

jobs:
  preview:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request_target' && vars.ARKPEDIA_PREVIEWS_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install trusted controller dependencies
        run: npm ci
      - name: Publish or retire the owned staging preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_STAGING_API_TOKEN }}
          PREVIEW_ACTION: ${{ github.event_name == 'pull_request_target' && 'closed' || inputs.action }}
          PREVIEW_PR: ${{ github.event.pull_request.number || inputs.pr }}
          PREVIEW_SOURCE: ${{ inputs.source }}
          PREVIEW_CHECK: ${{ inputs.check_run }}
          PREVIEW_BUILD: ${{ inputs.build_run }}
          PREVIEW_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          if [ "$PREVIEW_ACTION" = publish ]; then
            node scripts/deploy/preview-controller.mjs publish "$PREVIEW_PR" "$PREVIEW_SOURCE" "$PREVIEW_CHECK" "$PREVIEW_BUILD" "$PREVIEW_ARTIFACT"
          else
            node scripts/deploy/preview-controller.mjs "$PREVIEW_ACTION" "$PREVIEW_PR"
          fi
