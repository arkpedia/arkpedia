name: Build and publish Cloudflare Preview
run-name: Native Preview ${{ inputs.source || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Full source SHA to publish to the isolated redesign Preview
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: arkpedia-native-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 25
    steps:
      - name: Validate immutable source
        env:
          SOURCE: ${{ inputs.source }}
        run: '[[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Check Preview isolation and internal self-calls
        run: node --test scripts/tests/test-native-preview.mjs
      - name: Build Preview without deployment credentials
        env:
          ARKPEDIA_WORKER: '1'
          ARKPEDIA_CONTENT_CHANNEL: live
          ARKPEDIA_DEPLOYMENT_ROLE: staging
        run: node node_modules/@opennextjs/cloudflare/dist/cli/index.js build --config wrangler.preview.jsonc --openNextConfigPath open-next.preview.config.ts
      - name: Package immutable Preview
        run: |
          node -e 'const b=require("./public/build-info.json");if(b.commit!==process.env.SOURCE||b.dirty||b.deploymentRole!=="staging")throw Error("Unexpected Preview build")'
          tar --exclude=.open-next/cache -czf "$RUNNER_TEMP/arkpedia-preview.tgz" .open-next wrangler.preview.jsonc scripts/deploy/preview-worker.mjs public/build-info.json
          cd "$RUNNER_TEMP"
          sha256sum arkpedia-preview.tgz > arkpedia-preview.sha256
        env:
          SOURCE: ${{ inputs.source }}
      - uses: actions/upload-artifact@v7
        with:
          name: arkpedia-preview-${{ inputs.source }}
          path: |
            ${{ runner.temp }}/arkpedia-preview.tgz
            ${{ runner.temp }}/arkpedia-preview.sha256
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: arkpedia-preview-${{ inputs.source }}
          path: preview-artifact
      - name: Verify build and extract
        run: |
          cd preview-artifact
          sha256sum -c arkpedia-preview.sha256
          cd ..
          tar -xzf preview-artifact/arkpedia-preview.tgz
          node --test scripts/tests/test-native-preview.mjs
          node -e 'const b=require("./public/build-info.json");if(b.commit!==process.env.SOURCE||b.dirty||b.deploymentRole!=="staging")throw Error("Unexpected Preview build")'
        env:
          SOURCE: ${{ inputs.source }}
      - name: Publish the native Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PILOT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ff51c10571eaa9934bc451e1bfdb361
          WRANGLER_SEND_METRICS: 'false'
          OPEN_NEXT_DEPLOY: 'true'
        run: node node_modules/wrangler/bin/wrangler.js preview --config wrangler.preview.jsonc --worker-name arkpedia --name arkpedia --message "Redesign Preview ${{ inputs.source }}"
