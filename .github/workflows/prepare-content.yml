name: Prepare content release
on:
  schedule:
    # After the Global patch window and the public asset jobs (19:30–19:39 UTC).
    # This also leaves the English gamedata mirror time to publish its patch dump.
    - cron: '57 19 * * *'
  workflow_dispatch:
    inputs:
      # Blank: a refresh compiles arkpedia-data's imports branch (its nightly import) merged with
      # main, and a run without one compiles main.
      data_ref:
        description: 'Public data branch/ref to compile (blank = imports when refreshing, else main; or a correction branch)'
        default: ''
        type: string
      refresh_upstream:
        description: Run the steps that stay here (pull sources, story pages, checks) on the imported records
        default: true
        type: boolean
      # Set by the editorial watcher (scripts/content/editorial-watch.mjs): every daily refresh
      # moves data main past the editorial branch, and on 2026-10-13 that held three edits back
      # until someone merged main into it by hand.
      merge_main:
        description: 'If data_ref does not contain data main, merge main into it for this run (a conflict still fails)'
        default: false
        type: boolean
      # The one way past the record-count invariant, for a removal you intend: this run only,
      # named collections only, and the log and job summary still say how much each one lost.
      allow_shrink:
        description: 'Collections this run may shrink by more than 2%, comma-separated (names in COLLECTIONS, scripts/content/check-completeness.mjs), for a removal you intend'
        default: ''
        type: string
permissions:
  contents: read
  # Only for the failure reports at the end of the job.
  issues: write
# Production content preparations serialize and are never cancelled by a newer run.
concurrency:
  group: prepare-content-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref_name == 'main'
    # ARKPEDIA_RUNNER (a repository variable) names the self-hosted runner's label, e.g.
    # arkpedia-vps; unset, jobs run on GitHub's hosted runners. See docs/development/ci-runner.md.
    runs-on: ${{ vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    # Up to 30 of these minutes may go to waiting for the asset syncs (below), and up to 20 for native publication and 14 after
    # a publish to the page refresh's wait for the pointer (its step's own timeout): a job timeout
    # there would report a release that went out as failed, and skip the heartbeat.
    timeout-minutes: ${{ vars.ARKPEDIA_RUNNER && 120 || 100 }}
    steps:
      - uses: actions/checkout@v7
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Self-hosted runner homes persist: downloading ~484 MB over that local
          # npm cache costs more than npm ci. Fresh hosted runners still restore it.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      # Only main publishes data main and live. Feature Previews consume live content.
      - name: Choose the content channel
        id: channel
        run: |
          set -euo pipefail
          node scripts/content/channel.mjs --branch "$GITHUB_REF_NAME" > "$RUNNER_TEMP/channel.env"
          cat "$RUNNER_TEMP/channel.env" | tee -a "$GITHUB_ENV"
      # A release goes live only while production runs the code that compiles it: the publish
      # step asks production (one GET of its /build-info.json) and holds anything else
      # (scripts/content/deploy-gate.mjs). Asked here too, so a run that could not publish
      # stops now instead of after the compile; the report at the end says why.
      - name: Hold the release while production runs other code
        run: node scripts/content/deploy-gate.mjs --ref HEAD --held-file "$RUNNER_TEMP/release-held.md"
      # The release compiles the imports branch that arkpedia-data's nightly import leaves, and that
      # import waits for the asset repositories' syncs before it pins them. GitHub starts every
      # scheduled run hours late, by different amounts, so the order is kept by waits, not by the
      # crons: a scheduled release waits, up to 30 minutes, until the import has finished its run
      # of the day (scripts/content/asset-syncs.mjs --sync); a dispatched one does not wait. Before
      # the imports branch is read for the reuse key. Never fails the run: after the wait the
      # release compiles what the branch holds, and the import's own issue names a failure.
      - name: Wait for the day's import
        if: github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/content/asset-syncs.mjs wait --timeout-minutes 30 --sync arkpedia-data/import.yml
      # The probe falls back to each repository's last known commit when it cannot reach
      # one, so an outage of any single source never stops the day's run.
      - name: Load the last known upstream revisions
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .cache/refresh-fingerprint
          key: refresh-fingerprint-${{ github.run_id }}
          restore-keys: refresh-fingerprint-
      - name: Check upstream revisions
        id: upstream
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/content/refresh-fingerprint.mjs
      - name: Remember the upstream revisions
        if: github.event_name == 'schedule' && steps.upstream.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/refresh-fingerprint
          key: refresh-fingerprint-${{ github.run_id }}
      # The nightly import runs in arkpedia-data (its importer/, import.yml, docs/importer.md) and
      # leaves its records on the imports branch; a refresh compiles that branch merged with main,
      # running here only the steps that stay (scripts/content/run-stage.mjs importedStages). The
      # branch's head is part of the reuse key: new imports are always compiled.
      - name: Read the imported records
        id: imports
        if: github.event_name == 'schedule'
        run: echo "head=$(git ls-remote https://github.com/arkpedia/arkpedia-data.git refs/heads/imports | cut -f1)" | tee -a "$GITHUB_OUTPUT"
      - name: Reuse a successfully prepared input set
        id: prepared
        if: github.event_name == 'schedule'
        uses: actions/cache@v6
        with:
          path: .cache/prepared-inputs
          key: prepared-content-v1-${{ steps.upstream.outputs.fingerprint }}${{ steps.imports.outputs.head && format('-imports-{0}', steps.imports.outputs.head) || '' }}
      - name: Load public source records
        id: source
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        env:
          DATA_REF: ${{ inputs.data_ref || ((github.event_name == 'schedule' || inputs.refresh_upstream) && 'imports') || 'main' }}
          # The imports branch is rebuilt from main by each import, and editorial edits reach main
          # after it: always merged.
          MERGE_MAIN: ${{ (inputs.merge_main || inputs.data_ref == 'imports' || (!inputs.data_ref && (github.event_name == 'schedule' || inputs.refresh_upstream))) && 'true' || '' }}
        run: |
          set -euo pipefail
          [[ "$DATA_REF" =~ ^[A-Za-z0-9][A-Za-z0-9_./-]*$ ]]
          git clone --depth 1 https://github.com/arkpedia/arkpedia-data.git "$RUNNER_TEMP/arkpedia-data"
          git -C "$RUNNER_TEMP/arkpedia-data" fetch --depth 1 origin "$DATA_REF"
          git -C "$RUNNER_TEMP/arkpedia-data" checkout --detach FETCH_HEAD
          # A correction branch is published as a fast-forward of main, so it must
          # already contain main. Say so now, not after the compile; the publish
          # step checks again in case main moves in between.
          data_head=$(git -C "$RUNNER_TEMP/arkpedia-data" rev-parse HEAD)
          data_main=$(git -C "$RUNNER_TEMP/arkpedia-data" rev-parse origin/main)
          # The source commit this run compiles: a failure records it on the failed-release
          # issue, and only a run that compiled it (or a descendant) closes that issue.
          echo "head=$data_head" >> "${GITHUB_OUTPUT:-/dev/null}"
          if [ "$data_head" != "$data_main" ]; then
            # Both checkouts are shallow; deepen the branch until it reaches main.
            git -C "$RUNNER_TEMP/arkpedia-data" fetch --deepen=100 origin "$data_head"
            if git -C "$RUNNER_TEMP/arkpedia-data" merge-base --is-ancestor "$data_main" "$data_head"; then :
            elif [ "${MERGE_MAIN:-}" = true ]; then
              # The merge commit exists only in this checkout; the publish step pushes it to
              # main under the release commit, which leaves the branch behind main: published.
              git -C "$RUNNER_TEMP/arkpedia-data" fetch --deepen=100 origin main
              if ! git -C "$RUNNER_TEMP/arkpedia-data" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  merge --quiet --no-edit -m "Merge data main into $DATA_REF" "$data_main"; then
                git -C "$RUNNER_TEMP/arkpedia-data" merge --abort || true
                echo "::error::$DATA_REF ($data_head) conflicts with data main ($data_main). Merge main into it by hand, resolving the conflict, and push again."
                exit 1
              fi
              echo "Merged data main ($data_main) into $DATA_REF ($data_head) for this run."
            else
              echo "::error::$DATA_REF ($data_head) does not contain data main ($data_main). Merge main into the correction branch and dispatch again. Only the branch's last 100 commits are searched, so a longer branch reads as not containing main too."
              exit 1
            fi
          fi
          node scripts/content/hydrate-source.mjs "$RUNNER_TEMP/arkpedia-data"
          # What every collection held before any refresh step: check-completeness fails
          # the release if one of them shrinks by more than 2% from here, unless this run
          # was dispatched with allow_shrink naming it.
          node scripts/content/check-completeness.mjs --record-baseline
      - uses: actions/setup-python@v7
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - run: npm ci
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
      # The Python the steps here use, pinned in scripts/content/requirements.txt, which Dependabot
      # watches.
      - run: python -m pip install -r scripts/content/requirements.txt
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
      - name: Refresh supported upstream records
        id: refresh
        if: (github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true') && (github.event_name == 'schedule' || inputs.refresh_upstream)
        env:
          GH_TOKEN: ${{ github.token }}
          # The image repository's write key, for the story covers (main's run only: it is
          # production's, and the dev channel publishes no art). The import publishes all other art.
          CATALOGUE_IMAGE_DEPLOY_KEY: ${{ github.ref_name == 'main' && secrets.CATALOGUE_IMAGE_DEPLOY_KEY || '' }}
          # refresh-stage-data.sh adds its stages to this run instead of starting its own.
          ARKPEDIA_STAGE_RUN: '1'
          # The importer's step lists, in the data checkout: the holds its steps left in the
          # quarantine file are kept (run-stage.mjs declaredStages), and none of them runs again here.
          ARKPEDIA_IMPORTED_FROM: ${{ format('{0}/arkpedia-data/importer', runner.temp) }}
          ARKPEDIA_ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          set -euo pipefail
          # Every command is a stage (scripts/content/run-stage.mjs). One that fails has what
          # it changed under data/ and public/ put back, so its records stay as last published
          # (one that finishes an earlier stage's output in place takes that stage back with
          # it); the stages that --need it are skipped, the rest carry on, and
          # data/stage-report.json and the 'Content quarantined' issue say what happened. Only
          # an --invariant stage fails this step: the game tables no stage can do without (CN
          # from any one of its mirrors, EN) and the completeness invariants. Its quarantine
          # holds are kept even then, so the issue and the evidence show the day's, not
          # yesterday's.
          stage() { node scripts/content/run-stage.mjs run "$@"; }
          node scripts/content/run-stage.mjs begin
          trap 'node scripts/content/run-stage.mjs end' EXIT
          # One commit per upstream mirror for the whole run, in data/upstream.lock.json.
          stage pin-upstream -- node scripts/content/pin-upstream.mjs
          # The CN tables, every one from the same mirror at one commit (Kengxxiao, else
          # yuanyan3060), before anything reads them: the stages of refresh-stage-data.sh read its
          # checkout (scripts/content/cn-tables.mjs).
          stage upstream-cn --invariant --timeout-minutes 30 -- node scripts/content/cn-tables.mjs
          # The EN tables, and the story chapters and covers (their source refuses GitHub's
          # runners, so arkpedia-data's import cannot read it).
          bash scripts/sync/refresh-stage-data.sh
          # The story covers those staged under .cache/, published to arkpedia-image-assets
          # (config/staged-art.json); then story-covers runs again, so its record points at them.
          # With nothing staged, a no-op. A cover published re-pins the asset repositories
          # (assets:update), as the import's own staged-art stage does. Its holds go under
          # story-art, not staged-art, which the import's run owns.
          stage story-art -- env STAGED_ART_STAGE=story-art bash scripts/sync/publish-catalogue-assets.sh --staged
          # The pull planner's sources and first clears, built with its own code (lib/pulls) from
          # the records the import left and the EN tables.
          stage pulls -- npm run pulls:refresh
          # A scheduled limited, crossover or Orienteering banner whose announcement nobody has
          # read shows no odds in the pull planner. Each is listed in the daily issue until its
          # rules are in data/pull-odds-rules.json (scripts/content/check-pull-odds.ts). It reads
          # the day's banners, so it runs after every stage that adds them.
          stage odds-rules -- npx tsx scripts/content/check-pull-odds.ts
          # What the guessers send to readers, measured once every stage that adds records has
          # run. It writes nothing: over budget fails only this stage, so the daily issue names
          # it until the payload is trimmed or the budget raised, and the release still goes
          # out (scripts/audits/check-payload-budgets.ts).
          stage payload-budgets -- npm run check:payload-budgets
          stage completeness --invariant --keep data/quarantine.json -- node scripts/content/check-completeness.mjs
      # A run that does not refresh upstream (an editorial edit, which the watcher dispatches with
      # refresh_upstream=false) skips the refresh above and with it its palettes stage. A recipe or
      # review added on the editorial branch then left its palette automatic, and the palette test
      # below refused the whole compile: on 2026-10-13 six recipes blocked every later editorial
      # edit for nine hours. --if-stale reads only the palette file and its two inputs, and
      # downloads the art of just the palettes made from another review or recipe; with none it
      # does nothing, so an ordinary editorial run stays offline here.
      - name: Rebuild palettes whose review or recipe changed
        if: steps.refresh.outcome == 'skipped' && (github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true')
        run: python3 scripts/palettes/build-color-palettes.py --revisions data/assets/revisions.json --if-stale
      # The same for the event pages' PVs: an override added on the editorial branch
      # (data/event-video-overrides.json) is filed with the catalogue as it stands, reading nothing
      # from YouTube (scripts/sync/sync-official-videos.mjs --offline). Also after a refresh: the
      # import filed the videos with main's overrides as they were when it ran, and an edit
      # published since then comes in with main's merge.
      - name: File the official videos into events
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        run: npx tsx scripts/sync/sync-official-videos.mjs --offline

      - name: Restore the public YouTube discovery archive
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/youtube-discovery/archive.json
          key: youtube-discovery-${{ github.run_id }}
          restore-keys: youtube-discovery-
      - name: Refresh videos relevant to current Global content
        if: (github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true') && (github.event_name == 'schedule' || inputs.refresh_upstream)
        timeout-minutes: 6
        run: node --import tsx scripts/sync/sync-youtube-discovery.ts
      - name: Keep the public YouTube discovery archive
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/youtube-discovery/archive.json
          key: youtube-discovery-${{ github.run_id }}

      - name: Validate and compile data (no website build)
        if: github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true'
        env:
          ARKPEDIA_CONTENT_DISABLED: '1'
          # Hydration reads this checkout, rather than pull-data.mjs's default cache.
          # The unused-record check needs its Git tree to recognize data-first arrivals.
          ARKPEDIA_DATA_CACHE: ${{ format('{0}/arkpedia-data', runner.temp) }}
          NODE_ENV: production
          ARKPEDIA_ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          # check:published-assets:release lists every outfit voice folder with the contents API.
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/content/check-completeness.mjs
          npx tsx scripts/build/build-operator-search.ts
          # Hydration removes this derived fallback; selector pages/tests import it before export.
          npx tsx scripts/build/build-selector-catalogue.ts
          # Community ranking tests import this derived catalogue after hydration too.
          npx tsx scripts/build/build-community-stage-catalogue.ts
          # check:published-assets, except that a legacy voice clip an operator page offers
          # but the pinned voice repository lacks (a day the voices stage failed, or a newly
          # adopted voice revision that dropped one) holds back that clip, and a folder an asset
          # repository publishes that this code does not map yet (its mapping still on dev) is
          # held too, each as a quarantine entry, instead of the release. Before npm test,
          # whose folder test accepts an unmapped folder only with that entry.
          npm run check:published-assets:release
          npm test
          # check:assets, except that an icon a released operator's record names but the image
          # repository has not published yet (a Global launch renames art the day it lands)
          # holds back that icon, as a quarantine entry, instead of the release.
          npm run check:assets:release
          mkdir -p "$RUNNER_TEMP/prepared-content"
          cp -R "$RUNNER_TEMP/arkpedia-data/release" "$RUNNER_TEMP/prepared-content/release"
          node scripts/content/export.mjs "$RUNNER_TEMP/prepared-content"
          node scripts/content/validate-release.mjs "$RUNNER_TEMP/prepared-content"
      # Publish only after the checked production deployments accept this schema.
      - name: Publish the validated public release
        id: publish
        if: github.ref_name == 'main' && (github.event_name != 'schedule' || steps.prepared.outputs.cache-hit != 'true')
        env:
          CONTENT_DATA_DEPLOY_KEY: ${{ secrets.CONTENT_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # The deploy key and GitHub's host keys, for every push below (scripts/content/data-remote.sh).
          source scripts/content/data-remote.sh
          with_data_key
          repo="$RUNNER_TEMP/arkpedia-data"
          git -C "$repo" remote set-url origin "$DATA_REMOTE"
          prepared_base=$(git -C "$repo" rev-parse HEAD)
          git -C "$repo" fetch origin main
          current_base=$(git -C "$repo" rev-parse origin/main)
          # The release goes out as a fast-forward of main on top of the data it was
          # compiled from: main itself, or a correction branch that already contains
          # main. If main moved anywhere else meanwhile, e.g. to a correction published
          # while this one compiled, fail rather than overwrite it.
          if [ "$prepared_base" != "$current_base" ] && ! git -C "$repo" merge-base --is-ancestor "$current_base" "$prepared_base"; then
            # Load already deepened a correction branch until it reached main, so this
            # extra history is fetched only when main has moved since.
            git -C "$repo" fetch --deepen=100 origin "$prepared_base"
            if ! git -C "$repo" merge-base --is-ancestor "$current_base" "$prepared_base"; then
              echo "::error::Data main ($current_base) is not contained in the compiled data ($prepared_base). Merge main into the correction branch, or retry from the new main."
              exit 1
            fi
          fi
          # Compare with the release main serves, not the one the checkout carries: a
          # correction branch's own release/ is stale by design. Compare what they say (the
          # content id, scripts/content/release-input.mjs): a release that differs only in the
          # run's own records -- the upstream lock, the catalogue's report -- or in the app
          # commit that compiled the same pages has nothing to publish. A manifest from before
          # the content id falls back to its release id.
          prepared_release=$(node -p "(m => m.content ?? m.release)(require('$RUNNER_TEMP/prepared-content/release/manifest.json'))")
          current_release=$(git -C "$repo" show origin/main:release/manifest.json 2>/dev/null | node -p '(m => m.content ?? m.release)(JSON.parse(require("fs").readFileSync(0, "utf8")))' 2>/dev/null || true)
          if [ "$prepared_release" = "$current_release" ]; then
            if [ "$prepared_base" != "$current_base" ]; then
              # The branch's commits still go to main, as a fast-forward with no release commit:
              # left out, the branch never reads as published. On 2026-10-22 an editorial edit
              # the guide-videos stage had just made on main too was compiled every six minutes,
              # each run publishing nothing, until main was merged into editorial by hand. Nothing
              # is named for the live check: the release is the one live serves already.
              echo "::notice::Data main already serves this release: the branch's commits go to data main as they are, with no new release."
              git -C "$repo" push origin "$prepared_base:refs/heads/main"
            else
              echo "Release inputs are unchanged; ignoring generatedAt-only output."
            fi
            exit 0
          fi
          # Production must run the code that compiled this release, or it may not be able to
          # read it (scripts/content/deploy-gate.mjs). Asked again here, after the compile,
          # because a deploy can land in between; a hold fails the step, and the report at the
          # end opens the 'Content release held' issue with the reason.
          node scripts/content/deploy-gate.mjs --manifest "$RUNNER_TEMP/prepared-content/release/manifest.json" --held-file "$RUNNER_TEMP/release-held.md"
          git -C "$repo" checkout -B main "$prepared_base"
          rm -rf "$repo/source" "$repo/release"
          cp -R "$RUNNER_TEMP/prepared-content/source" "$RUNNER_TEMP/prepared-content/release" "$repo/"
          # Replaced trees may contain a case-only rename (Gallus² -> GALLUS²).
          # Rebuild these index entries so core.ignorecase cannot keep the old path.
          git -C "$repo" rm -r --cached --quiet --ignore-unmatch source release
          git -C "$repo" add source release
          if ! git -C "$repo" diff --cached --quiet; then
            git -C "$repo" config user.name 'github-actions[bot]'
            git -C "$repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$repo" commit -m 'Refresh game content and prepared page data'
          fi
          if [ "$(git -C "$repo" rev-parse HEAD)" = "$current_base" ]; then echo 'Content unchanged.'; exit 0; fi
          # Never forced: if main moves after the check above, the push is refused.
          git -C "$repo" push origin HEAD:main
          # For the live check below: the commit arkpedia-data's Content release must point at.
          echo "pushed=$(git -C "$repo" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # arkpedia-data's Content release workflow validates what was pushed and only then moves
      # the live pointer (live/current.json). When it fails, readers keep the previous release
      # and nothing here would say so. Polls the live branch through git: raw.githubusercontent
      # keeps current.json in its cache for five minutes. Never fails the run: the data is on
      # data main either way, and the issue says what is missing. Once live has moved, await-live
      # names the commit it serves as this step's `revision` output, for the page refresh below:
      # the pushed one, or a later data main commit that superseded it.
      # Native publication has taken 11 minutes; the former five-minute wait skipped page
      # refreshes even when storage publication succeeded. Keep the wait inside its step budget.
      - name: Confirm the release went live
        id: live
        if: steps.publish.outputs.pushed != ''
        continue-on-error: true
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          ARKPEDIA_LIVE_TIMEOUT_SECONDS: '1200'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          alert=(--alert content-release-not-live --title 'Content release not live')
          if node scripts/content/await-live.mjs --revision "$PUSHED" --repo "$RUNNER_TEMP/arkpedia-data" > "$RUNNER_TEMP/live-state.txt"; then
            cat "$RUNNER_TEMP/live-state.txt"
            node scripts/content/alert-issue.mjs close "${alert[@]}" --comment "The live pointer serves the release pushed as $PUSHED: $RUN_URL"
          else
            cat "$RUNNER_TEMP/live-state.txt"
            body="$RUNNER_TEMP/not-live.md"
            { printf 'This run pushed the release as arkpedia-data `%s` (%s), but the live pointer did not move to it:\n\n' "$PUSHED" "$RUN_URL"
              cat "$RUNNER_TEMP/live-state.txt"
              cat <<'EOF'

          Readers keep the previous release until it does. The **Content release** workflow of arkpedia-data validates each push to main and then moves `live/current.json`; its run for this commit says why it did not: https://github.com/arkpedia/arkpedia-data/actions/workflows/content.yml
          EOF
            } > "$body"
            node scripts/content/alert-issue.mjs open "${alert[@]}" --body-file "$body"
            echo "::warning::The live pointer did not move to $PUSHED."
            exit 1
          fi
      # The pages that regenerate slowest (lib/content/releaseRefresh.ts: the home page every
      # 25 minutes, for its live feeds) showed the previous release until their interval ran
      # out. Ask each live deployment of the channel's branch for them (pages/api/release-refresh.ts)
      # once the pointer moved and a server can read it: up to five minutes of raw.githubusercontent's cache
      # and a server's minute later (scripts/content/refresh-pages.mjs waits them out). Asked
      # sooner, the pages regenerated with the previous release. Never failing the run: they
      # refresh on their own interval anyway.
      - name: Refresh the pages that wait longest for a release
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        env:
          ARKPEDIA_RELEASE_REFRESH_SECRET: ${{ secrets.ARKPEDIA_RELEASE_REFRESH_SECRET }}
          # The commit the pointer names once a server can read the release: on main what the live
          # check found live serving, which is a later commit than the push when another push
          # superseded it (waiting for the pushed one held the runner nine minutes, then warned);
          REVISION: ${{ steps.live.outputs.revision }}
        run: node scripts/content/refresh-pages.mjs --revision "$REVISION" --pointer "$ARKPEDIA_CONTENT_POINTER"
      # Import/compile/push success does not prove readers see the new catalogue.
      # After the existing cache wait, verify the channel's real stage page and
      # its immutable index against this run's manifest. A stale/fallback page is
      # an explicit failed run, not a green import with an old served catalogue.
      - name: Verify served stage catalogue
        if: steps.live.outcome == 'success'
        timeout-minutes: 10
        run: node scripts/audits/check-served-stages.mjs "$RUNNER_TEMP/prepared-content/release/manifest.json"
      # Asset pins take whatever each repository's HEAD is, so a red sync never shows up
      # here on its own. Report it, but never hold back the day's content over it: this
      # runs after the publish step, and a slow or failing GitHub API call only fails
      # this step, within its own timeout.
      # Production publication signals.
      - name: Report failing asset syncs
        if: ${{ !cancelled() && github.ref_name == 'main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          failing=''
          # The syncs the release waits for before it starts (scripts/content/asset-syncs.mjs).
          syncs=$(node scripts/content/asset-syncs.mjs list)
          for sync in $syncs; do
            repo=${sync%%/*} workflow=${sync#*/}
            # The latest finished run, scheduled or started by hand: a green manual rerun
            # of a failed sync clears it.
            if run=$(gh api "repos/arkpedia/$repo/actions/workflows/$workflow/runs?status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0] // {} | [.conclusion // "no finished run", .created_at // "", .html_url // ""] | @tsv'); then
              IFS=$'\t' read -r conclusion created url <<< "$run"
              # A success older than three days means the schedule itself stopped.
              if [ "$conclusion" = success ] && [[ "$created" > "$cutoff" ]]; then continue; fi
              failing+="- arkpedia/$repo \`$workflow\`: $conclusion ${created:0:10} $url"$'\n'
            else
              failing+="- arkpedia/$repo \`$workflow\`: its runs could not be read"$'\n'
            fi
          done
          alert=(--alert asset-sync-failing --title 'Asset sync failing')
          if [ -n "$failing" ]; then
            echo "::warning::Asset syncs are failing; content releases pin each asset repository's current HEAD."
            body="$RUNNER_TEMP/asset-sync-report.md"
            printf 'The latest finished run (scheduled or manual) of each asset sync below failed or is more than three days old (checked by %s). Content releases do not wait for them; they pin the current commit of each repository.\n\n%s' "$RUN_URL" "$failing" > "$body"
            node scripts/content/alert-issue.mjs open "${alert[@]}" --body-file "$body"
          else
            node scripts/content/alert-issue.mjs close "${alert[@]}" --comment "Every asset sync's latest finished run succeeded: $RUN_URL"
          fi
      # One open issue while any record is held back or any refresh stage did not run to the
      # end, rewritten by every run; a record held back, or a stage failing, for more than
      # three days is marked overdue (the runner dates each stage in data/quarantine.json).
      # It is commented on at most once a day, and only when its list changed; it closes
      # after a published run whose stages all ran, with nothing to list. Never holds back
      # or fails the release.
      - name: Report quarantined content
        if: ${{ !cancelled() && steps.prepared.outputs.cache-hit != 'true' && github.ref_name == 'main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/quarantine-report"
          state=$(node scripts/content/quarantine-report.mjs "$report")
          alert=(--alert content-quarantined --title 'Content quarantined')
          if [ "$state" = alert ]; then
            node scripts/content/alert-issue.mjs open "${alert[@]}" --rewrite --body-file "$report/body.md" --comment-file "$report/comment.md"
          elif [ "$state" = clear ] && [ "$JOB_STATUS" = success ]; then
            node scripts/content/alert-issue.mjs close "${alert[@]}" --comment "Nothing is quarantined and every refresh stage ran: $RUN_URL"
          fi
      - name: Keep discovery evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: content-refresh-evidence
          path: |
            .cache/catalogue/report.json
            .cache/catalogue/asset-plan.json
            data/stage-report.json
            data/quarantine.json
          if-no-files-found: ignore
      - name: Remember successful preparation
        if: github.event_name == 'schedule' && steps.prepared.outputs.cache-hit != 'true'
        run: mkdir -p .cache/prepared-inputs && touch .cache/prepared-inputs/complete
      # One open issue per outage: later failures comment on it, at most once a day, and
      # the next good run closes it. On main a timeout counts as a cancellation, so it is
      # reported too. Found by a hidden marker, not the title (scripts/content/alert-issue.mjs).
      # The dev channel's under issues of its own ("(dev)"), so a broken dev run is visible and
      # never opens or closes production's. A cancelled dev run is not reported: dev's queue
      # cancels a run whenever a newer one starts (concurrency, above), so a dev cancellation is
      # almost always that, and a timeout there goes unreported with it. Main always reports,
      # whichever step failed. On another branch only a failed channel step keeps it quiet: that
      # is a branch with no channel, and nothing would ever close its issue. A channel step that
      # never ran (the checkout or setup-node failed first) still reports, for dev as for main --
      # and so would a dispatch from a branch with no channel that failed that early, the one
      # case this lets through. A run that failed that early has no checkout or no Node, and
      # reports with gh alone (below); arkpedia-data's heartbeat watchdog covers a runner that
      # never starts the job.
      - name: Report the failed release
        if: (failure() || (cancelled() && github.ref_name == 'main')) && (github.ref_name == 'main' || steps.channel.outcome != 'failure')
        env:
          ALERT_SUFFIX: ${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}
          TITLE_SUFFIX: ${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_HEAD: ${{ steps.source.outputs.head }}
        run: |
          # Failed before the checkout or setup-node: no alert-issue.mjs, or no node to run it (the
          # NAS runners' image keeps its Node off PATH, infra/runners/nas/Dockerfile; setup-node
          # puts one there). Said with gh alone, under the marker that script finds the issue by
          # (marker(), scripts/content/alert-issue.mjs), so the next good run's close step closes
          # it; an issue already open for the alert gets nothing more.
          if [ ! -f scripts/content/alert-issue.mjs ] || ! command -v node > /dev/null; then
            alert="<!-- arkpedia-alert:content-release-failing$ALERT_SUFFIX -->"
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,body \
              --jq "[.[] | select((.body // \"\") | startswith(\"$alert\"))][0].number // empty")
            if [ -z "$open" ]; then
              printf '%s\nPrepare content release ended with %s before it could run its own scripts (%s, %s): %s\n' \
                "$alert" "$JOB_STATUS" "$GITHUB_EVENT_NAME" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$RUN_URL" > "$RUNNER_TEMP/failed-release.md"
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Content release failing$TITLE_SUFFIX" --body-file "$RUNNER_TEMP/failed-release.md"
            fi
            exit 0
          fi
          # Held by the release gate (deploy-gate.mjs wrote why): its own issue, since the fix is
          # a deploy, not this workflow. Nothing else fails a run after a hold.
          if [ -s "$RUNNER_TEMP/release-held.md" ]; then
            body="$RUNNER_TEMP/held-release.md"
            { cat "$RUNNER_TEMP/release-held.md"; echo; echo "Held by $RUN_URL ($GITHUB_EVENT_NAME, $(date -u '+%Y-%m-%d %H:%M UTC'))."; } > "$body"
            node scripts/content/alert-issue.mjs open --alert "content-release-held$ALERT_SUFFIX" --title "Content release held$TITLE_SUFFIX" --body-file "$body"
            exit 0
          fi
          body="$RUNNER_TEMP/failed-release.md"
          echo "Prepare content release ended with $JOB_STATUS ($GITHUB_EVENT_NAME, $(date -u '+%Y-%m-%d %H:%M UTC')): $RUN_URL" > "$body"
          # With the source commit it compiled, kept with every earlier one still failing
          # (scripts/content/release-failure.mjs): the issue closes only once one run has
          # compiled them all.
          node scripts/content/release-failure.mjs record --alert "content-release-failing$ALERT_SUFFIX" --title "Content release failing$TITLE_SUFFIX" --body-file "$body" --source "${SOURCE_HEAD:-none}"
      - name: Close the failed-release report
        if: success()
        continue-on-error: true
        env:
          ALERT_SUFFIX: ${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}
          TITLE_SUFFIX: ${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_HEAD: ${{ steps.source.outputs.head }}
        run: |
          # Only when this run compiled every source commit the issue records as failing: on
          # 2026-10-13 a run of data main closed it while the failing editorial commit, which
          # it did not contain, stayed unpublished (scripts/content/release-failure.mjs).
          node scripts/content/release-failure.mjs recover --alert "content-release-failing$ALERT_SUFFIX" --title "Content release failing$TITLE_SUFFIX" --source "${SOURCE_HEAD:-none}" --comment "Recovered: $RUN_URL"
          node scripts/content/alert-issue.mjs close --alert "content-release-held$ALERT_SUFFIX" --title "Content release held$TITLE_SUFFIX" --comment "The deployments of its branch run the code this run compiled with, and the run succeeded: $RUN_URL"
      # The public watchdog in arkpedia-data (.github/workflows/release-heartbeat.yml) opens an
      # issue there when neither a release nor a heartbeat is newer than 26 hours: the one
      # alarm that needs no job here to start, so it also covers a runner that is offline or
      # jobs GitHub refuses to run. A day with nothing new to publish leaves only this commit,
      # so it is not taken for an outage. One small commit on the heartbeat branch, which
      # arkpedia-data's Content release ignores (it runs for main). Never fails the run.
      - name: Record the heartbeat
        if: success() && github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 3
        env:
          CONTENT_DATA_DEPLOY_KEY: ${{ secrets.CONTENT_DATA_DEPLOY_KEY }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source scripts/content/data-remote.sh
          with_data_key
          beat="$RUNNER_TEMP/heartbeat.json"
          node -e 'console.log(JSON.stringify({ version: 1, at: new Date().toISOString(), event: process.env.GITHUB_EVENT_NAME, run: process.env.RUN_URL, published: process.env.PUSHED || null }, null, 2))' > "$beat"
          # On top of the last heartbeat; the first one starts the branch.
          push_file_to_branch heartbeat "$beat" "Prepare content release succeeded ($GITHUB_EVENT_NAME)"
  # A successful main preparation immediately rechecks editorial edits. Keep the
  # workflow-dispatch token out of the scraper job and never loop after a failure.
  notify-editorial:
    needs: prepare
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.prepare.result == 'success' }}
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Recheck editorial edits after publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run editorial-content.yml --repo "$GITHUB_REPOSITORY" --ref main -f "after_run=$GITHUB_RUN_ID"
