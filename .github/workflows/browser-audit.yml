name: Browser audit

# Independent from Check and deployment: the exhaustive suite on main, once a night and on
# demand, without delaying a PR preview or release. It ran on every push to main on GitHub's
# hosted runners until 2026-10-28: at about 85 hosted minutes a run (the suite alone took
# over an hour there) that was more than the organization's 2,000 free minutes a month
# could carry, and it had failed since 2026-10-26 anyway (the build's type check ran out
# of Node's default 2 GB heap). It now runs where the content jobs do (ARKPEDIA_RUNNER, the
# NAS), at a quiet hour, so it never shares the NAS with a day's Checks.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ${{ vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    # The full suite takes about 14 minutes on the NAS with five workers (28 with two) and over
    # an hour on a hosted runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      # Game records live in arkpedia-data; this repository keeps code only. The live release's
      # records, the ones www serves (scripts/content/pull-data.mjs).
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - run: python -m pip install -r scripts/requirements.txt
      - name: Build audit site
        run: npm run build
        env:
          ARKPEDIA_CONTENT_DISABLED: '1'
          ARKPEDIA_YOUTUBE_FEED_FIXTURE: tests/fixtures/youtube-feeds.xml
          NEXT_TELEMETRY_DISABLED: '1'
          # The build's type check ran out of Node's default 2 GB heap (every run since
          # 2026-10-26); Check gives its typecheck the same room.
          NODE_OPTIONS: --max-old-space-size=4096
      # --with-deps installs system libraries with sudo; a self-hosted runner has them already.
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Exhaustive desktop and mobile audit
        run: npm run test:browser -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/browser-audit-results.json
          # The NAS /tmp is a 2 GB tmpfs; Chromium's profiles must use the job directory (as Check).
          TMPDIR: ${{ runner.temp }}
          # Five on the NAS Check runner, as in Check (check.yml); two on a hosted runner.
          PW_WORKERS: ${{ runner.environment == 'github-hosted' && '2' || '5' }}
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            .cache/browser-audit-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 7
