name: Recruitment Guesser

on:
  pull_request:
    branches: [main, games-foundation]
  workflow_dispatch:

concurrency:
  group: recruitment-guesser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:recruitment-guesser
