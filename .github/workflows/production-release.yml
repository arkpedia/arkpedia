name: Release production

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      check_run:
        description: Successful push Check for the exact current main source
        required: true
        type: string

# Publishes www.arkpedia.net after a green main Check. It began, before Vercel was retired, as the
# release of the Cloudflare "pilot"; the Worker has served production since, and the workflow
# was renamed to say so on 2026-10-29 (it was cloudflare-pilot-release.yml, "Release Cloudflare
# pilot"). Internal names the stored content depends on keep the old word: the R2 keys under
# pilot-v1/, the /__content/pilot/ path, and the scripts/deploy/pilot-*.mjs modules.
# Off unless ARKPEDIA_PRODUCTION_RELEASES_ENABLED is 'true' (the owner's switch).
concurrency:
  group: arkpedia-production-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: >-
      vars.ARKPEDIA_PRODUCTION_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      ARKPEDIA_PRODUCTION_RELEASES_ENABLED: ${{ vars.ARKPEDIA_PRODUCTION_RELEASES_ENABLED }}
      RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_CHECK: ${{ github.event.workflow_run.id || inputs.check_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Authorize the exact successful current-main Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/pilot-release-gate.mjs "$RELEASE_CHECK" "$RELEASE_SOURCE"
      - name: Use disk-backed temporary storage
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned dependencies without deployment credentials
        run: npm ci
      # Game records live in arkpedia-data; this repository keeps code only. The live release's
      # records, the ones www serves (scripts/content/pull-data.mjs).
      - name: Pull the live game records
        run: node scripts/content/pull-data.mjs
      - name: Build production once, without deployment credentials
        run: npm run cf:build
        env:
          # Match Check's bounded heap for the full UI's TypeScript validation.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Require the adopted public assets in R2
        run: node scripts/deploy/check-public-assets-ready.mjs
      - name: Revalidate and publish production
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # The Worker-scoped deploy token. Store it as ARKPEDIA_PRODUCTION_API_TOKEN to retire the old
          # secret name; until then the old one is read.
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARKPEDIA_PRODUCTION_API_TOKEN || secrets.ARKPEDIA_PILOT_API_TOKEN }}
        run: node scripts/deploy/pilot-release.mjs "$RELEASE_CHECK" "$RELEASE_SOURCE"
      - uses: actions/upload-artifact@v7
        if: always() && steps.release.outcome != 'skipped'
        with:
          name: production-release-${{ github.run_id }}
          path: .cache/pilot-release-receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  resume-content:
    needs: release
    if: success()
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resume held content only when every main reader matches
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/deploy/resume-pilot-content.mjs "$RELEASE_SOURCE"
