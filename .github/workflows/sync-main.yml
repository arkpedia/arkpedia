name: Sync main into dev

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: ['sync/main-to-dev-*']

# Serialize candidate creation and completion. A newer release is reconciled against
# the current branch tips, including when it arrives while an integration Check runs.
concurrency:
  group: sync-main-into-dev
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Privileged workflow_run always executes trusted main's orchestration code,
      # never scripts from the integration branch which completed Check.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile production history after a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/sync-main-to-dev.mjs
