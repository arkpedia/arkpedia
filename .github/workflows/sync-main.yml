name: Sync main into dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checked_run:
        description: Completed integration Check run to resume (empty prepares a new sync)
        type: string
        required: false

# Serialize candidate creation and completion. A newer release is reconciled against
# the current branch tips, including when it arrives while an integration Check runs.
concurrency:
  group: sync-main-into-dev
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Completion dispatch always executes trusted main's orchestration code,
      # never scripts from the integration branch which completed Check.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile production history after a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/sync-main-to-dev.mjs
