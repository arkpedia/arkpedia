# Deploy to Vercel from CI, after the Check workflow has passed on main.
#
# The Vercel project (arkpedia-dev) has no Git integration, so until now production
# was whatever `npm run deploy:vercel` found in someone's working tree: no CI in front
# of it, the bundle built on a laptop's Node (26) for functions declared nodejs24.x,
# and vercel.json's ignoreCommand never consulted. This runs the same three commands
# the script runs, on Node 24, only after check.yml is green for that exact commit.
#
# One secret is needed: VERCEL_TOKEN (Vercel → Account Settings → Tokens, scoped to
# the Mocchibirds team). The org and project ids below are not secrets; they are what
# `.vercel/project.json` holds locally.
name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Only for the failed-deploy report at the end of the job.
  issues: write

jobs:
  deploy:
    # Only a green Check on main deploys; a manual run trusts the operator.
    # Only a green Check of a push to this repository's main: a pull request whose branch is
    # also called main (a fork's) must never deploy with the production token.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    # ARKPEDIA_RUNNER (a repository variable) names the self-hosted runner's label, e.g.
    # arkpedia-vps; unset, jobs run on GitHub's hosted runners. See docs/development/ci-runner.md.
    runs-on: ${{ vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.ARKPEDIA_RUNNER && 45 || 30 }}
    env:
      VERCEL_ORG_ID: team_PdK2g24xbV0rLWIQrHvkTNnN
      VERCEL_PROJECT_ID: prj_rGdk34hEbAky1IniF9GLXeRCFtSj
      VERCEL_SCOPE: mocchibirds
      VERCEL_CLI_VERSION: 59.23.1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Checked out before anything can fail, so the report at the end has its script even
      # when the token is missing (the 2026-09-21 outage).
      - uses: actions/checkout@v7
        with:
          # Deploy the commit Check actually verified, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          # Matches the runtime the functions declare (nodejs24.x).
          node-version: '24'
          cache: npm
      - name: Refuse to run without the deploy token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npm ci
      - name: Link the project and pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Prepare the Build Output bundle
        run: node scripts/deploy/prepare-vercel-output.mjs
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --archive=tgz --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      # One open issue per outage, found by its marker (scripts/content/alert-issue.mjs): the
      # 09-18..09-22 outage was nine red runs that only the Actions tab showed. Production keeps
      # its last build meanwhile, and content releases stay held while it runs other code than
      # main (scripts/content/deploy-gate.mjs). The next successful deploy closes it.
      - name: Report the failed deploy
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYING: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          body="$RUNNER_TEMP/failed-deploy.md"
          echo "Deploy ended with $JOB_STATUS for ${DEPLOYING:0:12} ($GITHUB_EVENT_NAME, $(date -u '+%Y-%m-%d %H:%M UTC')): $RUN_URL. Production keeps its previous build, and content releases stay held until it runs main's code." > "$body"
          node scripts/content/alert-issue.mjs open --alert deploy-failing --title 'Deploy failing' --body-file "$body"
      - name: Close the failed-deploy report
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYING: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/content/alert-issue.mjs close --alert deploy-failing --title 'Deploy failing' --comment "Deployed ${DEPLOYING:0:12}: $RUN_URL"
