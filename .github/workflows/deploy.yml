# Deploy to Vercel from CI, after the Check workflow has passed on main or dev.
#
# The only way this repository reaches Vercel: vercel.json turns Vercel's own Git deployments
# off for every project linked to it, since they build without the Check and cannot say which
# commit they are (write-build-info.mjs needs .git, which .vercelignore strips).
# Production was once whatever `npm run deploy:vercel` found in someone's working tree: no CI
# in front of it, the bundle built on a laptop's Node (26) for functions declared nodejs24.x.
# This runs the same three commands the script runs, on Node 24, only after check.yml is
# green for that exact commit, and uploads the prebuilt output, so no build minute is spent
# on Vercel.
#
# Where it goes is config/production.json (scripts/deploy/deploy-targets.mjs): every live
# deployment that follows the branch Check passed, one after another, each built with its own
# project's settings and environment. Since 2026-09-30 main is www.arkpedia.net (kukki's
# project, which had been Git-linked to this repository with its domains assigned
# automatically) and dev is arkpedia-dev.vercel.app. A deployment listed as not live gets
# nothing automatically; a manual run with "preview" ticked uploads a preview there, which
# moves none of its domains.
#
# Each deployment names the secret holding its Vercel token (Vercel → Account Settings →
# Tokens, scoped to that team): VERCEL_TOKEN for Mocchibirds, VERCEL_TOKEN_ARKPEDIA_NET for
# kukki's team. The org and project ids are not secrets; they are what `.vercel/project.json`
# holds locally.
name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      preview:
        description: Upload a preview to each deployment that is not live yet (config/production.json), instead of deploying production
        type: boolean
        default: false
      commit:
        description: Exact checked commit to deploy (defaults to the selected branch)
        type: string
        required: false

# One queue per branch: a group holds one waiting run, and a dev deploy queued behind a main
# one would otherwise cancel it.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # Only for the failed-deploy report at the end of the job.
  issues: write
  # Only to start a content release: one held for this deploy, or the dev channel's after a dev
  # deploy (the last two steps).
  actions: write

jobs:
  targets:
    # Only a green Check on main or dev deploys; a manual run trusts the operator.
    # Only a green Check of a push to this repository's main or dev: a pull request whose
    # branch is also called main (a fork's) must never deploy with the production token.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev')
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    # ARKPEDIA_RUNNER (a repository variable) names the self-hosted runner's label, e.g.
    # arkpedia-vps; unset, jobs run on GitHub's hosted runners. See docs/development/ci-runner.md.
    # This job only lists the targets, so it takes the light runner (ARKPEDIA_LIGHT_RUNNER)
    # and does not wait behind a Check on the main one.
    runs-on: ${{ vars.ARKPEDIA_LIGHT_RUNNER || vars.ARKPEDIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Validate an explicitly pinned deploy commit
        if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
        env:
          PINNED_COMMIT: ${{ inputs.commit }}
        run: '[[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full checked commit SHA" >&2; exit 1; }'
      # The commit Deploy builds decides where it goes, so a flip to live deploys with the gate
      # that reads it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: List the deployments
        id: list
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: node scripts/deploy/deploy-targets.mjs --branch "$BRANCH" ${{ inputs.preview && '--preview' || '' }} >> "$GITHUB_OUTPUT"

  deploy:
    needs: targets
    # A branch no deployment follows (a manual run from a feature branch) has nothing to do.
    if: needs.targets.outputs.targets != '[]'
    name: deploy (${{ matrix.target.name }}, ${{ matrix.target.environment }})
    strategy:
      # One after another, in the file's order: the last one starts a held release again. A
      # failed one does not stop the next.
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    # Never fall back to paid hosted builds or the VPS when the NAS is unavailable.
    # arkpedia-nas-build is on all three NAS runners; truenas-deploy carries ONLY it, so no
    # Check (vars.ARKPEDIA_RUNNER, arkpedia-nas) can take it and a deploy never queues behind
    # two 23-minute Checks (2026-10-13: a production deploy waited 40 minutes for a runner).
    runs-on: [self-hosted, Linux, X64, arkpedia-nas-build]
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ matrix.target.orgId }}
      VERCEL_PROJECT_ID: ${{ matrix.target.projectId }}
      VERCEL_SCOPE: ${{ matrix.target.scope }}
      VERCEL_ENVIRONMENT: ${{ matrix.target.environment }}
      VERCEL_CLI_VERSION: 59.23.1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Checked out before anything can fail, so the report at the end has its script even
      # when the token is missing (the 2026-09-21 outage).
      - uses: actions/checkout@v7
        with:
          # Deploy the commit Check actually verified, not whatever main is by now.
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          # And its parent, for what the commit changed (the dev channel's run, last step).
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          # Matches the runtime the functions declare (nodejs24.x).
          node-version: '24'
          # Self-hosted runner homes persist: downloading ~484 MB over that local
          # npm cache costs more than npm ci. Fresh hosted runners still restore it.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Refuse to run without the deploy token
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
          TOKEN_SECRET: ${{ matrix.target.tokenSecret }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::$TOKEN_SECRET is not set. Add a Vercel token for the $VERCEL_SCOPE team under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Verify Vercel cannot start independent Git builds
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
        run: node scripts/deploy/check-vercel-build-policy.mjs
      # Vercel owns the one dependency install: vercel.json requires locked npm ci
      # with dev tools. An outer install followed by Vercel's npm install rewrote
      # package-lock.json and produced dirty build metadata on an otherwise green deploy.
      - name: Link the project and pull its settings
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment="$VERCEL_ENVIRONMENT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      # prebuild builds with the live content release's asset pins where they are newer than
      # the committed ones (scripts/build/adopt-release-asset-pins.mjs); the token only raises
      # the GitHub API limit for the one compare call per repository whose pins differ.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
          GH_TOKEN: ${{ github.token }}
          PROD: ${{ matrix.target.production && '--prod' || '' }}
          # The content pointer this deployment reads: live, or dev-live for dev's own releases
          # (scripts/content/channel.mjs); inlined into the build by next.config.js. Only this
          # step sets it: the asset-link check after the deploy finds the same pointer from the
          # job's VERCEL_PROJECT_ID (scripts/content/content-channel.cjs looks the project up).
          ARKPEDIA_CONTENT_CHANNEL: ${{ matrix.target.contentChannel }}
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build $PROD --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Verify the built output identity
        env:
          ARKPEDIA_CONTENT_CHANNEL: ${{ matrix.target.contentChannel }}
        run: node scripts/deploy/check-build-identity.mjs local
      - name: Prepare the Build Output bundle
        run: node scripts/deploy/prepare-vercel-output.mjs
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.target.tokenSecret] }}
          PROD: ${{ matrix.target.production && '--prod' || '' }}
          TARGET: ${{ matrix.target.name }}
        run: |
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt $PROD --meta "arkpediaBuildRunner=$RUNNER_NAME" --meta "arkpediaBuildRun=$GITHUB_RUN_ID" --archive=tgz --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "$VERCEL_ENVIRONMENT deployment for $TARGET: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the public deployed identity
        id: build-identity
        if: matrix.target.production
        env:
          ARKPEDIA_CONTENT_CHANNEL: ${{ matrix.target.contentChannel }}
          SITE: ${{ matrix.target.url }}
        run: node scripts/deploy/check-build-identity.mjs live "$SITE"
      # Every /<folder>/... asset path is a redirect to the commit this build pinned. The
      # nightly release moves its own pins, and a build that lags them sends newer art to a
      # commit without it (the 2026-09-25 404 on /material-icons/). prebuild adopts the
      # release's newer pins but only warns when it cannot; this asks production for a file
      # only the live release's commit has (HEAD, following the redirect) and fails the job
      # when it is not 200, so the report below opens the 'Deploy failing' issue. A release
      # that went live while Build ran (newer than a pin the build adopted) is a warning
      # instead, since no build could have had it: the file asked for is then one of the pin
      # this build used, and the next deploy adopts the newer one. The token is for the one
      # GitHub compare call that orders the two pins. Production only: a preview sits behind
      # its team's Vercel login.
      - name: Check that asset links reach the release's art
        id: asset-links
        if: matrix.target.production
        env:
          GH_TOKEN: ${{ github.token }}
          ARKPEDIA_DEPLOYMENTS: ${{ matrix.target.url }}
        run: node scripts/deploy/check-asset-redirects.mjs
      # The pulled settings include the project's environment variables, secrets among them
      # (kukki's project has its database's); the runner's workspace outlives the job.
      - name: Forget the pulled project settings
        if: always()
        run: rm -rf .vercel
      # One open issue per deployment's outage, found by its marker (scripts/content/
      # alert-issue.mjs): the 09-18..09-22 outage was nine red runs that only the Actions tab
      # showed. Production keeps its last build meanwhile, and its channel's content releases
      # stay held while it runs other code than its branch's (scripts/content/deploy-gate.mjs:
      # main's release asks main's deployments, the dev channel's dev's). The next successful
      # deploy there closes it.
      - name: Report the failed deploy
        if: matrix.target.production && (failure() || cancelled())
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYING: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          ASSET_LINKS: ${{ steps.asset-links.outcome }}
          BUILD_IDENTITY: ${{ steps.build-identity.outcome }}
          ALERT: ${{ matrix.target.alert }}
          SITE: ${{ matrix.target.url }}
          BRANCH: ${{ matrix.target.branch }}
        run: |
          body="$RUNNER_TEMP/failed-deploy.md"
          if [ "$BUILD_IDENTITY" = failure ]; then
            echo "Upload for ${DEPLOYING:0:12} completed, but $SITE did not verify that exact clean build identity within the propagation limit: $RUN_URL. Public HTTP success alone is insufficient. The deployed version must be inspected and content publication stays held until its identity is verified." > "$body"
          elif [ "$ASSET_LINKS" = failure ]; then
            echo "Deployed ${DEPLOYING:0:12} to $SITE ($GITHUB_EVENT_NAME, $(date -u '+%Y-%m-%d %H:%M UTC')), but its asset links lag the live content release: a root-relative path to art the release has redirects to an asset commit without it, and 404s. The check's log names the file: $RUN_URL. Production runs this build; redeploy once the Build step can adopt the release's pins (its warning says why it could not), or bump data/assets/revisions.json as the check's log says." > "$body"
          else
            echo "Deploy to $SITE ended with $JOB_STATUS for ${DEPLOYING:0:12} ($GITHUB_EVENT_NAME, $(date -u '+%Y-%m-%d %H:%M UTC')): $RUN_URL. Production keeps its previous build, and content releases stay held until it runs $BRANCH's code." > "$body"
          fi
          node scripts/content/alert-issue.mjs open --alert "$ALERT" --title "Deploy failing: ${SITE#https://}" --body-file "$body"
      - name: Close the failed-deploy report
        if: matrix.target.production && success() && steps.build-identity.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYING: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          ALERT: ${{ matrix.target.alert }}
          SITE: ${{ matrix.target.url }}
        run: |
          node scripts/content/alert-issue.mjs close --alert "$ALERT" --title "Deploy failing: ${SITE#https://}" --comment "Deployed ${DEPLOYING:0:12}: $RUN_URL"
      # A release is held while production runs other code than the one compiling it
      # (scripts/content/deploy-gate.mjs), and nothing else retries it. On one runner that is
      # easy to hit: a push near the nightly run lets the release take the runner before this
      # Deploy, and the site would miss a day of content. Production runs this build now, so
      # start the release again, a full refresh like the scheduled one. For main's deployments
      # only, the ones the gate asks, and after the last of them, when every earlier one has
      # had its turn. On the deploy step's
      # success plus the verified public identity: an HTTP 200 or upload alone cannot
      # prove the live build is clean. Asset-link failures still retain their own report.
      - name: Release again if one was held for this deploy
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.build-identity.outcome == 'success' && matrix.target.releaseGate && matrix.target.last }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          held=$(node scripts/content/alert-issue.mjs find --alert content-release-held --title 'Content release held')
          if [ "$held" = none ]; then echo "No content release is held."; exit 0; fi
          echo "Content release held (issue #$held): production runs this deploy now, so Prepare content release starts again."
          gh workflow run prepare-content.yml --repo "$GITHUB_REPOSITORY" --ref main -f refresh_upstream=true
      # The dev channel (scripts/content/channel.mjs): once arkpedia-dev runs a new build of dev,
      # compile data main's records with that code and publish them to dev-live, so the build's
      # effect on the data shows on arkpedia-dev without waiting for main. A newer dev deploy's
      # run supersedes this one (prepare-content.yml cancels dev runs in progress). Never for
      # main: its release is the scheduled one. The upstream refresh only when the commit changes
      # what the refresh runs (scripts/content/dev-refresh.mjs): a page or style change compiles
      # data main's records with it and leaves the sources alone; dev's nightly run refreshes.
      - name: Prepare dev's own content release
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.build-identity.outcome == 'success' && matrix.target.production && matrix.target.branch == 'dev' && matrix.target.last }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything but a plain false from a script that succeeded refreshes: one that failed,
          # whatever it printed, or printed nothing or something else. Under the step's `bash -e`, a
          # crash in the assignment ended the step and started no dev run at all, and anything but
          # true or false is a value gh refuses for a boolean input.
          refresh=$(node scripts/content/dev-refresh.mjs) || refresh=true
          [ "$refresh" = false ] || refresh=true
          gh workflow run prepare-content.yml --repo "$GITHUB_REPOSITORY" --ref dev -f refresh_upstream="$refresh"
