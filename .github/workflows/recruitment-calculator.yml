name: Recruitment calculator
on:
  pull_request:
    branches: [main, games-foundation]
  workflow_dispatch:
concurrency:
  group: recruitment-calculator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/tests/test-recruitment.ts
