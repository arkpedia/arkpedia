name: Evaluate YouTube categories
on:
  # Paid experiments need a separately authorized budget; PRs never spend credits.
  workflow_dispatch:
    inputs:
      authorized_test_calls:
        description: 'Approved live test budget (requires separate user authorization)'
        type: choice
        options: ['20']
        required: true
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Evaluate the labeled public metadata (20 calls)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_EVALUATION_CALL_BUDGET: ${{ inputs.authorized_test_calls }}
        run: node --import tsx scripts/audits/evaluate-youtube-topics.ts
      - name: Save exact public requests and answers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jev-evaluation
          path: jev-evaluation.json
          if-no-files-found: ignore
