# Added to /etc/nginx/sites-enabled/relay.arkpedia.net, beside the account-import relay.
#
# At http level (top of the file, with the other zones):
limit_conn_zone $binary_remote_addr zone=arkaudio_conn:1m;
limit_req_zone $binary_remote_addr zone=arkaudio_req:1m rate=120r/m;

# In the 443 server block, before `location /`:
    # The music player's audio relay (infra/audio-relay): a song's file in byte ranges. A media
    # element sends no Origin; its Referer, when it sends one, must be one of our pages.
    location ~ "^/msr/[0-9]{1,12}$" {
        valid_referers none blocked www.arkpedia.net arkpedia.net arkpedia-dev.vercel.app;
        if ($invalid_referer) { return 403; }
        limit_conn arkaudio_conn 8;
        limit_req zone=arkaudio_req burst=60 nodelay;
        proxy_pass http://unix:/run/arkaudio/audio.sock;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 300s;
    }
