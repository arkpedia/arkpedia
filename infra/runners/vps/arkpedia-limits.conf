# CI jobs share this box with nginx and tailscaled (the home NAS gateway).
# The runner and every job it starts stay inside these limits: past MemoryMax the kernel
# kills inside this cgroup only, and OOMScoreAdjust makes a job the first choice if the
# whole box runs short.
[Unit]
Requires=ghrunner-egress.service
After=ghrunner-egress.service

[Service]
MemoryHigh=2600M
MemoryMax=3000M
MemorySwapMax=4G
CPUWeight=30
IOWeight=30
Nice=10
OOMScoreAdjust=800
TasksMax=4096
